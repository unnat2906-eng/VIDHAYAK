<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIDHAYAK IG PANEL (PLAYWRIGHT MIX)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #05050a; color: #00ffcc; font-family: monospace; }
        .glass { background: rgba(10, 15, 30, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(0, 255, 204, 0.2); }
        .cyber-input { background: #0b0f19; border: 1px solid rgba(0, 255, 204, 0.4); color: #fff; }
        .cyber-input:focus { border-color: #00ffcc; outline: none; box-shadow: 0 0 10px rgba(0, 255, 204, 0.3); }
    </style>
</head>
<body class="p-4 max-w-4xl mx-auto">
    <header class="text-center mb-6">
        <h1 class="text-2xl font-black tracking-wider text-cyan-400">🕷️ ⚡ VIDHAYAK IG PANEL (PLAYWRIGHT MIX)</h1>
        <p class="text-xs text-gray-400">24/7 Persistent Multi-GC Automation & Creator Suite</p>
    </header>

    <!-- Navigation Tabs -->
    <div class="flex gap-2 mb-6">
        <button onclick="switchTab('spam')" id="btn-spam" class="flex-1 py-2 font-bold bg-cyan-500 text-black rounded transition">INSTAGRAM SPAM</button>
        <button onclick="switchTab('ig-creator')" id="btn-ig-creator" class="flex-1 py-2 font-bold bg-gray-800 text-cyan-400 border border-cyan-500/30 rounded transition">IG GC CREATOR</button>
        <button onclick="switchTab('tg-creator')" id="btn-tg-creator" class="flex-1 py-2 font-bold bg-gray-800 text-cyan-400 border border-cyan-500/30 rounded transition">TELEGRAM GC CREATOR</button>
    </div>

    <!-- TAB 1: INSTAGRAM SPAM -->
    <div id="tab-spam" class="space-y-4">
        <div class="glass p-4 rounded-xl">
            <h2 class="text-lg font-bold text-cyan-300 mb-3">➕ Add Playwright Multi GC Bot</h2>
            <div class="space-y-3">
                <input id="spam-session" type="text" placeholder="Session ID (sessionid cookie)" class="cyber-input w-full p-2 rounded text-sm">
                <textarea id="spam-groups" placeholder="Group Thread IDs or Links (one per line)" class="cyber-input w-full p-2 rounded text-sm h-20"></textarea>
                <textarea id="spam-messages" placeholder="Messages (comma separated, e.g. Hello, Hi, Spam)" class="cyber-input w-full p-2 rounded text-sm h-16"></textarea>
                <div class="flex gap-2">
                    <input id="spam-delay" type="number" placeholder="Delay (sec)" value="2" class="cyber-input flex-1 p-2 rounded text-sm">
                    <button onclick="addSpamTask()" class="bg-cyan-500 text-black font-bold px-6 py-2 rounded hover:bg-cyan-400">🚀 START SPAM BOT</button>
                </div>
            </div>
        </div>
        <div id="spam-tasks-list" class="space-y-4"></div>
    </div>

    <!-- TAB 2: INSTAGRAM GC CREATOR -->
    <div id="tab-ig-creator" class="space-y-4 hidden">
        <div class="glass p-4 rounded-xl">
            <h2 class="text-lg font-bold text-cyan-300 mb-3">➕ Add Instagram GC Creator Task</h2>
            <div class="space-y-3">
                <input id="ig-session" type="text" placeholder="SESSION ID" class="cyber-input w-full p-2 rounded text-sm">
                <input id="ig-add-users" type="text" placeholder="ADD USERS (user1, user2...)" class="cyber-input w-full p-2 rounded text-sm">
                <input id="ig-remove-users" type="text" placeholder="REMOVE USERS (user1, user2...)" class="cyber-input w-full p-2 rounded text-sm">
                <div class="flex gap-2">
                    <input id="ig-count" type="number" placeholder="GC COUNT" value="1" class="cyber-input flex-1 p-2 rounded text-sm">
                    <input id="ig-delay" type="number" placeholder="GC DELAY (sec)" value="3" class="cyber-input flex-1 p-2 rounded text-sm">
                </div>
                <button onclick="addIgCreatorTask()" class="w-full bg-cyan-500 text-black font-bold py-2 rounded hover:bg-cyan-400">💾 SAVE & START IG CREATOR</button>
            </div>
        </div>
        <div id="ig-tasks-list" class="space-y-4"></div>
    </div>

    <!-- TAB 3: TELEGRAM GC CREATOR -->
    <div id="tab-tg-creator" class="space-y-4 hidden">
        <div class="glass p-4 rounded-xl">
            <h2 class="text-lg font-bold text-cyan-300 mb-3">➕ Add Telegram GC Creator Task</h2>
            <div class="space-y-3">
                <div class="flex gap-2">
                    <input id="tg-api" type="text" placeholder="YOUR API" class="cyber-input flex-1 p-2 rounded text-sm">
                    <input id="tg-hash" type="text" placeholder="YOUR HASH" class="cyber-input flex-1 p-2 rounded text-sm">
                </div>
                <div class="flex gap-2">
                    <input id="tg-number" type="text" placeholder="YOUR NUMBER" class="cyber-input flex-1 p-2 rounded text-sm">
                    <button onclick="sendTelegramOtp()" class="bg-yellow-500 text-black font-bold px-4 rounded text-xs hover:bg-yellow-400">SEND OTP</button>
                </div>
                <input id="tg-2fa" type="text" placeholder="YOUR 2F PASS" class="cyber-input w-full p-2 rounded text-sm">
                <button onclick="connectTelegram()" class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-500 text-sm">CONNECT</button>
                <textarea id="tg-users" placeholder="USERS (username1, username2, username3...)" class="cyber-input w-full p-2 rounded text-sm h-16"></textarea>
                <div class="flex gap-2">
                    <input id="tg-count" type="number" placeholder="GC COUNT" value="1" class="cyber-input flex-1 p-2 rounded text-sm">
                    <input id="tg-delay" type="number" placeholder="GC DELAY (sec)" value="3" class="cyber-input flex-1 p-2 rounded text-sm">
                </div>
                <button onclick="addTelegramTask()" class="w-full bg-cyan-500 text-black font-bold py-2 rounded hover:bg-cyan-400">💾 SAVE TELEGRAM TASK</button>
            </div>
        </div>
        <div id="tg-tasks-list" class="space-y-4"></div>
    </div>

    <!-- OTP Popup Modal -->
    <div id="otp-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center hidden z-50">
        <div class="glass p-6 rounded-xl w-80 space-y-4 border border-cyan-500">
            <h3 class="text-md font-bold text-cyan-300">Enter Telegram OTP</h3>
            <input id="tg-otp-input" type="text" placeholder="Enter OTP code" class="cyber-input w-full p-2 rounded text-sm">
            <div class="flex gap-2">
                <button onclick="closeOtpModal()" class="flex-1 bg-gray-700 py-1.5 rounded text-xs">Cancel</button>
                <button onclick="verifyOtp()" class="flex-1 bg-cyan-500 text-black font-bold py-1.5 rounded text-xs">Verify</button>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.getElementById('tab-spam').classList.add('hidden');
            document.getElementById('tab-ig-creator').classList.add('hidden');
            document.getElementById('tab-tg-creator').classList.add('hidden');
            document.getElementById('btn-spam').className = "flex-1 py-2 font-bold bg-gray-800 text-cyan-400 border border-cyan-500/30 rounded transition";
            document.getElementById('btn-ig-creator').className = "flex-1 py-2 font-bold bg-gray-800 text-cyan-400 border border-cyan-500/30 rounded transition";
            document.getElementById('btn-tg-creator').className = "flex-1 py-2 font-bold bg-gray-800 text-cyan-400 border border-cyan-500/30 rounded transition";

            if(tab === 'spam') {
                document.getElementById('tab-spam').classList.remove('hidden');
                document.getElementById('btn-spam').className = "flex-1 py-2 font-bold bg-cyan-500 text-black rounded transition";
            } else if(tab === 'ig-creator') {
                document.getElementById('tab-ig-creator').classList.remove('hidden');
                document.getElementById('btn-ig-creator').className = "flex-1 py-2 font-bold bg-cyan-500 text-black rounded transition";
            } else if(tab === 'tg-creator') {
                document.getElementById('tab-tg-creator').classList.remove('hidden');
                document.getElementById('btn-tg-creator').className = "flex-1 py-2 font-bold bg-cyan-500 text-black rounded transition";
            }
        }

        function sendTelegramOtp() {
            fetch('/api/telegram/send-otp', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({api: document.getElementById('tg-api').value, hash: document.getElementById('tg-hash').value, number: document.getElementById('tg-number').value})
            }).then(res => res.json()).then(data => {
                alert(data.message || "OTP Sent!");
                document.getElementById('otp-modal').classList.remove('hidden');
            });
        }

        function closeOtpModal() {
            document.getElementById('otp-modal').classList.add('hidden');
        }

        function verifyOtp() {
            alert("OTP Verified!");
            closeOtpModal();
        }

        function connectTelegram() {
            fetch('/api/telegram/connect', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({two_fa: document.getElementById('tg-2fa').value})
            }).then(res => res.json()).then(data => alert(data.message));
        }

        function addSpamTask() {
            const data = {
                session_id: document.getElementById('spam-session').value,
                groups: document.getElementById('spam-groups').value,
                message: document.getElementById('spam-messages').value,
                delay: document.getElementById('spam-delay').value
            };
            fetch('/api/accounts', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            }).then(() => fetchStatus());
        }

        function addIgCreatorTask() {
            const data = {
                session_id: document.getElementById('ig-session').value,
                usernames: document.getElementById('ig-add-users').value,
                remove_users: document.getElementById('ig-remove-users').value,
                gc_count: document.getElementById('ig-count').value,
                delay: document.getElementById('ig-delay').value
            };
            fetch('/api/creators', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            }).then(() => fetchStatus());
        }

        function addTelegramTask() {
            const data = {
                api: document.getElementById('tg-api').value,
                hash: document.getElementById('tg-hash').value,
                number: document.getElementById('tg-number').value,
                users: document.getElementById('tg-users').value,
                gc_count: document.getElementById('tg-count').value,
                delay: document.getElementById('tg-delay').value
            };
            fetch('/api/telegram', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            }).then(() => fetchStatus());
        }

        function controlAction(endpoint, id) {
            fetch(`/api/${endpoint}/${id}/start`, {method: 'POST'}).then(() => fetchStatus());
        }
        function stopAction(endpoint, id) {
            fetch(`/api/${endpoint}/${id}/stop`, {method: 'POST'}).then(() => fetchStatus());
        }
        function deleteAction(endpoint, id) {
            fetch(`/api/${endpoint}/${id}`, {method: 'DELETE'}).then(() => fetchStatus());
        }

        function fetchStatus() {
            fetch('/api/all-status').then(res => res.json()).then(data => {
                renderList('accounts', data.accounts, data.statuses, 'spam-tasks-list', 'accounts');
                renderList('creators', data.creators, data.statuses, 'ig-tasks-list', 'creators');
                renderList('telegram_bots', data.telegram_bots, data.statuses, 'tg-tasks-list', 'telegram');
            });
            fetch('/api/logs-all').then(res => res.json()).then(logs => {
                for(const [id, lines] of Object.entries(logs)) {
                    const el = document.getElementById(`log-${id}`);
                    if(el) el.innerText = lines.join('\n');
                }
            });
        }

        function renderList(key, items, statuses, containerId, apiPrefix) {
            const container = document.getElementById(containerId);
            if(!container) return;
            container.innerHTML = '';
            for(const [id, item] of Object.entries(items || {})) {
                const stat = statuses[id] || {running: false, sent: 0, created: 0, failed: 0, last_action: 'Idle'};
                container.innerHTML += `
                    <div class="glass p-4 rounded-xl border border-cyan-500/30 space-y-2">
                        <div class="flex justify-between items-center">
                            <span class="text-xs text-cyan-400 font-bold">Task ID: ${id}</span>
                            <div class="flex gap-2">
                                <button onclick="controlAction('${apiPrefix}', '${id}')" class="bg-green-600 px-3 py-1 text-xs font-bold rounded text-white">START</button>
                                <button onclick="stopAction('${apiPrefix}', '${id}')" class="bg-red-600 px-3 py-1 text-xs font-bold rounded text-white">STOP</button>
                                <button onclick="deleteAction('${apiPrefix}', '${id}')" class="bg-gray-700 px-2 py-1 text-xs font-bold rounded text-red-400">✕</button>
                            </div>
                        </div>
                        <div class="flex gap-4 text-xs">
                            <span>Status: <b>${stat.running ? '🟢 Running' : '🔴 Stopped'}</b></span>
                            <span>Action: <b>${stat.last_action}</b></span>
                        </div>
                        <div class="bg-black/60 p-2 rounded text-xs font-mono h-24 overflow-y-auto text-green-400" id="log-${id}">Loading logs...</div>
                    </div>
                `;
            }
        }

        setInterval(fetchStatus, 3000);
        fetchStatus();
    </script>
</body>
</html>
