<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNNAT | SONA PANEL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #050509; color: #f3f4f6; min-height: 100vh; }
        .ios-bold { font-weight: 800; letter-spacing: -0.025em; }
        .glass-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        .btn-3d { transition: all 0.2s ease; box-shadow: 0 4px 0 #0284c7; }
        .btn-3d:active { transform: translateY(4px); box-shadow: 0 0 0 #0284c7; }
    </style>
</head>
<body class="p-4 md:p-6 pb-20">

    <!-- LOGIN MODAL -->
    <div id="login-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/95 p-4">
        <div class="glass-card max-w-md w-full p-8 rounded-3xl text-center border border-cyan-500/30 shadow-2xl">
            <h1 class="text-3xl ios-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-pink-500 mb-1">UNNAT | SONA</h1>
            <p class="text-xs text-pink-400 tracking-widest font-bold mb-6">PANEL ❤</p>
            <div id="device-badge" class="mb-6 py-2 px-4 rounded-xl bg-black/60 border border-gray-800 text-xs text-cyan-300 ios-bold">Detecting device...</div>
            <form onsubmit="handleLogin(event)" class="space-y-4 text-left">
                <input type="text" id="username" placeholder="Username (UNNAT)" required class="w-full bg-black/60 border border-gray-700 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-cyan-400">
                <input type="password" id="password" placeholder="Password" required class="w-full bg-black/60 border border-gray-700 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-cyan-400">
                <button type="submit" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 btn-3d ios-bold text-sm rounded-xl text-white">ENTER PANEL 🚀</button>
            </form>
            <p id="login-error" class="text-pink-400 text-xs mt-3 hidden"></p>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard" class="max-w-4xl mx-auto space-y-6 hidden">
        
        <!-- HEADER -->
        <header class="glass-card p-6 rounded-3xl flex justify-between items-center border border-cyan-500/20">
            <div>
                <h1 class="text-2xl ios-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-pink-500">UNNAT | SONA ❤</h1>
                <p class="text-xs text-gray-400 mt-1">Multi-Session Automation Hub</p>
            </div>
            <div class="bg-cyan-950/60 border border-cyan-500/40 px-4 py-2 rounded-2xl text-xs text-cyan-300 ios-bold">LIVE 24/7 ⚡</div>
        </header>

        <!-- INSTAGRAM MODULE -->
        <div class="glass-card p-6 rounded-3xl space-y-4">
            <h3 class="text-base ios-bold text-cyan-400 flex items-center gap-2">📸 Instagram Automation & NC Panel</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <input type="text" id="insta-session" placeholder="Enter Instagram sessionid cookie" class="bg-black/60 border border-gray-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-cyan-400">
                <button onclick="connectInsta()" class="py-3 bg-gradient-to-r from-pink-500 to-purple-600 btn-3d ios-bold text-xs rounded-xl text-white">Connect Session 🔗</button>
            </div>
            <div id="insta-status" class="text-xs text-gray-400">Status: Not Connected</div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 pt-2">
                <input type="text" id="insta-target" placeholder="Target Name / Text" class="bg-black/60 border border-gray-700 rounded-xl p-3 text-xs text-white focus:outline-none">
                <button onclick="startInstaTask('nc')" class="py-3 bg-cyan-600 btn-3d ios-bold text-xs rounded-xl text-white">Start Name Changer ⚡</button>
                <button onclick="startInstaTask('spam')" class="py-3 bg-rose-600 btn-3d ios-bold text-xs rounded-xl text-white">Start Spam Loop 🔥</button>
            </div>
        </div>

        <!-- WHATSAPP MODULE -->
        <div class="glass-card p-6 rounded-3xl space-y-4">
            <h3 class="text-base ios-bold text-emerald-400 flex items-center gap-2">💬 WhatsApp Bot Pairing</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <input type="text" id="wa-phone" placeholder="Enter Phone Number with Country Code" class="bg-black/60 border border-gray-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-emerald-400">
                <button onclick="pairWhatsApp()" class="py-3 bg-gradient-to-r from-emerald-500 to-teal-600 btn-3d ios-bold text-xs rounded-xl text-white">Generate Pair Code 🔗</button>
            </div>
            <div id="wa-result" class="text-xs text-emerald-300 font-mono"></div>
        </div>

        <!-- TELEGRAM MODULE -->
        <div class="glass-card p-6 rounded-3xl space-y-4">
            <h3 class="text-base ios-bold text-blue-400 flex items-center gap-2">🤖 Telegram Multi-Bot Manager (Unnatv5)</h3>
            <div class="space-y-3">
                <textarea id="tg-tokens" rows="3" placeholder="Enter Bot Tokens separated by comma (,)" class="w-full bg-black/60 border border-gray-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-blue-400"></textarea>
                <input type="text" id="tg-owner" placeholder="Owner Telegram User ID" class="w-full bg-black/60 border border-gray-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-blue-400">
                <button onclick="deployTelegram()" class="w-full py-3 bg-gradient-to-r from-blue-500 to-indigo-600 btn-3d ios-bold text-xs rounded-xl text-white">Deploy 24/7 Daemons 🚀</button>
            </div>
            <div id="tg-status" class="text-xs text-blue-300"></div>
        </div>

        <!-- REAL-TIME LOGS -->
        <div class="glass-card p-6 rounded-3xl space-y-3">
            <h3 class="text-sm ios-bold uppercase text-gray-300">Real-Time Terminal Logs</h3>
            <div id="realtime-logs" class="bg-black/90 p-4 rounded-2xl border border-gray-800 font-mono text-xs text-emerald-400 h-44 overflow-y-auto"></div>
        </div>

    </div>

    <script>
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        const badge = document.getElementById("device-badge");
        badge.innerText = isIOS ? "iOS Device Connected (Bold 3D Mode)" : "Desktop / Android Connected";
        if(isIOS) badge.classList.add("ios-bold");

        async function handleLogin(e) {
            e.preventDefault();
            const fd = new URLSearchParams();
            fd.append("username", document.getElementById("username").value);
            fd.append("password", document.getElementById("password").value);
            const res = await fetch("/api/login", { method: "POST", body: fd });
            const data = await res.json();
            if(data.success) {
                document.getElementById("login-modal").style.display = "none";
                document.getElementById("dashboard").style.display = "block";
                setInterval(fetchLogs, 2000);
            } else {
                const err = document.getElementById("login-error");
                err.innerText = data.message;
                err.style.display = "block";
            }
        }

        async function connectInsta() {
            const sid = document.getElementById("insta-session").value;
            const fd = new URLSearchParams();
            fd.append("session_id", sid);
            const res = await fetch("/api/insta/connect-session", { method: "POST", body: fd });
            const data = await res.json();
            if(data.success) {
                document.getElementById("insta-status").innerText = `Connected as: @${data.username}`;
                document.getElementById("insta-status").className = "text-xs text-emerald-400 font-bold";
            } else {
                alert(data.message);
            }
        }

        async function startInstaTask(type) {
            const sid = document.getElementById("insta-session").value;
            const target = document.getElementById("insta-target").value;
            const fd = new URLSearchParams();
            fd.append("task_type", type);
            fd.append("session_id", sid);
            fd.append("target_data", target);
            const res = await fetch("/api/insta/start-task", { method: "POST", body: fd });
            const data = await res.json();
            alert(data.message);
        }

        async function pairWhatsApp() {
            const phone = document.getElementById("wa-phone").value;
            const fd = new URLSearchParams();
            fd.append("phone", phone);
            const res = await fetch("/api/whatsapp/pair", { method: "POST", body: fd });
            const data = await res.json();
            document.getElementById("wa-result").innerText = `Pairing Code Generated: ${data.pair_code}`;
        }

        async function deployTelegram() {
            const tokens = document.getElementById("tg-tokens").value;
            const owner = document.getElementById("tg-owner").value;
            const fd = new URLSearchParams();
            fd.append("tokens", tokens);
            fd.append("owner_id", owner);
            const res = await fetch("/api/telegram/deploy", { method: "POST", body: fd });
            const data = await res.json();
            document.getElementById("tg-status").innerText = `Successfully deployed ${data.active_count} bot nodes running 24/7!`;
        }

        async function fetchLogs() {
            const res = await fetch("/api/logs");
            const data = await res.json();
            let html = "";
            data.logs.forEach(l => html += `<div>> ${l}</div>`);
            document.getElementById("realtime-logs").innerHTML = html;
        }
    </script>
</body>
</html>
